[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lelabo"
version = "0.1.0"
description = "Modular research lab for learning algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adrien Kegreisz" }]
keywords = ["machine learning", "research", "optimization", "deep learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "zstandard>=0.22",
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.3",
    "ano-optimizer>=1.0.0",
    "gymnasium>=0.29",
    "transformers>=4.40",
    "datasets>=2.18",
]

[project.urls]
Homepage = "https://adrienkegreisz.github.io/lelabo/"
Repository = "https://github.com/adrienkegreisz/lelabo"
Issues = "https://github.com/adrienkegreisz/lelabo/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
    "pytest>=8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
lelabo = "lelabo.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lelabo*"]

[tool.setuptools.package-data]
"lelabo.config.assets" = ["*.toml"]
"lelabo.capsule.templates" = ["*.md", "*.toml"]

[tool.pytest.ini_options]
markers = [
    "heavy: opt-in local research audits (warn-only).",
]
