[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lelabo"
version = "0.1.0"
description = "Modular research lab for learning algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adrien Kegreisz" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "numpy>=1.26"]
supervised = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.3",
]
rl = [
    "gymnasium>=0.29",
]
nlp = [
    "transformers>=4.40",
    "datasets>=2.18",
]
capsule = [
    "zstandard>=0.22",
]

[project.scripts]
lelabo = "lab.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lab*"]

[tool.pytest.ini_options]
markers = [
    "heavy: opt-in local research audits (warn-only).",
]
