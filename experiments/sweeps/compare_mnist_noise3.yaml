name: compare_all_mnist_test
display_keys: [algo, lr, seed, layers, hidden, input-noise-dataset, noise-on-test, optimizer]

base:
  dataset: mnist
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw

grid:
  algo: [bp, softhebb, dfa, dni, fa]
  seed: [0]
  input-noise-dataset: [0.0, 1.0, 2.0, 4.0, 5.0]
  noise-on-test: [0, 1]
  lr: [1e-3]
  hidden: [256]
  layers: [2]
