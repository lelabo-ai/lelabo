# Enable `capsule_sgd` in `optimizers/example.py` before using this config.
config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "mnist"
[dataset.params]

[model]
name = "cnn"
[model.params]
channels = [32, 64, 128]
kernel_sizes = [3, 3, 3]
use_bn = true
pool_every = 1
activation = "relu"
output_activation = "identity"
head_mode = "gap"

[initializer]
name = "torch_default"
[initializer.params]

[loss]
name = "ce"
[loss.params]

[update_rule]
name = "bp"
[update_rule.params]

[optimizer]
name = "capsule_sgd"
[optimizer.params]
lr = 0.05
weight_decay = 5e-4

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
display = "compact"
run_dir = "runs/capsule_optimizer_demo"

[train]
epochs = 10
batch = 64
val_frac = 0.1
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 5
min_delta = 0.0
warmup = 2
restore_best = true

[[metrics]]
name = "acc"
