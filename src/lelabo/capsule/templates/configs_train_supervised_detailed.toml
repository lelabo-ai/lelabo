config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "mnist"
[dataset.params]

[model]
name = "mlp"
[model.params]
hidden = 2048
layers = 4
activation = "relu"

[initializer]
name = "none"
[initializer.params]

[loss]
name = "cross_entropy"
[loss.params]

[update_rule]
name = "bp"
[update_rule.params]

[optimizer]
name = "adamw"
[optimizer.params]
lr = 0.001
weight_decay = 0.01
momentum = 0.9

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
verbose = 1
run_dir = "runs/supervised_demo"

[train]
epochs = 50
batch = 64
val_frac = 0.1
input_noise_training = 0.0
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 5
min_delta = 0.0
warmup = 5
restore_best = true

# Optional custom callback plugin:
# [[callbacks]]
# name = "my_callback"
# enabled = true
# [callbacks.params]
# every_n_epochs = 5

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "accuracy"

[[metrics]]
name = "f1"
[metrics.params]
average = "macro"

# Optional custom metric plugin:
# [[metrics]]
# name = "my_metric"
# [metrics.params]
# alpha = 0.5
