config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "mnist"
[dataset.params]

[model]
name = "cnn"
[model.params]
channels = [32, 64, 128]
kernel_sizes = [3, 3, 3]
use_bn = true
pool_every = 1
activation = "relu"
output_activation = "identity"
head_mode = "gap"

[initializer]
name = "torch_default"
[initializer.params]

[loss]
name = "ce"
[loss.params]

[update_rule]
name = "bp"
[update_rule.params]

[optimizer]
name = "sgd+momentum"
[optimizer.params]
lr = 0.05
weight_decay = 5e-4
momentum = 0.9

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
display = "compact"  # one of: none, compact, rich
run_dir = "runs/supervised_demo"
save_checkpoints = false

[train]
epochs = 20
batch = 64
val_frac = 0.1
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 8
min_delta = 0.0
warmup = 5
restore_best = true

# Optional custom callback plugin:
# [[callbacks]]
# name = "my_callback"
# enabled = true
# [callbacks.params]
# every_n_epochs = 5

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "acc"

# Optional custom metric plugin:
# [[metrics]]
# name = "my_metric"
# [metrics.params]
# alpha = 0.5
