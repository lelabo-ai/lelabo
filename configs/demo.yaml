name: demo
display_keys: [algo, lr, seed, hidden, layers]

base:
  dataset: iris
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw
  lr: 1e-3

grid:
  algo: [bp, softhebb, kp]
  seed: [0]
  hidden: [256, 1024]
  layers: [2, 5, 10]
