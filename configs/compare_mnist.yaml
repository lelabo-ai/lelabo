name: compare_all_mnist
display_keys: [algo, lr, seed, layers, hidden, optimizer]

base:
  dataset: mnist
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw

grid:
  algo: [bp, kp, dfa, fa, dni, softhebb, tp]
  seed: [0]
  lr: [1e-4, 1e-3, 1e-2]
  hidden: [256, 512, 2048]
  layers: [2, 5, 10]
