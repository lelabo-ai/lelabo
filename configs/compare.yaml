name: compare_all_softmax
display_keys: [algo, lr, seed, layers, hidden,  optimizer]

base:
  dataset: mnist
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw
  hidden: 256

grid:
  algo: [softhebb]
  seed: [0]
  layers: [2, 8, 16]
  lr: [1e-3]
