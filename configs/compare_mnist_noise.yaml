name: compare_mnist_noise
display_keys: [algo, lr, seed, layers, hidden, input-noise-dataset, noise-on-test, optimizer]

base:
  dataset: mnist
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw

grid:
  algo: [dni]
  seed: [1, 2, 3, 4]
  input-noise-training: [0.0, 1.0, 5.0, 10, 15, 20]
  lr: [1e-3]
  hidden: [256, 1024, 2048]
  layers: [2, 8, 16]
