config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "mnist"
[dataset.params]

[model]
name = "mlp"
[model.params]
hidden = 1024
layers = 3
activation = "relu"

[initializer]
name = "torch_default"
[initializer.params]

[loss]
name = "ce"
[loss.params]

[update_rule]
name = "dfa"
[update_rule.params]

[optimizer]
name = "sgd"
[optimizer.params]
lr = 0.01
weight_decay = 0.0

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
display = "compact"

[train]
epochs = 10
batch = 64
val_frac = 0.1
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 5
min_delta = 0.0
warmup = 2
restore_best = true

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "acc"
