config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "cifar10"
[dataset.params]
# CIFAR10/CIFAR100:
# - augment=false (default) => no train-time augmentation
# - augment=true => RandomCrop(32, padding=4) + RandomHorizontalFlip on train split only
augment = true
# num_workers = 2
# pin_memory = true

[model]
name = "cnn"
[model.params]
channels = [32, 64]
kernel_sizes = [5, 3]
pools = [true, true]
use_bn = false
activation = "tanh"
output_activation = "identity"
head_mode="flatten"

[initializer]
name = "none"
[initializer.params]
# seed = 2

[update_rule]
name = "drtp"
[update_rule.params]
activation = "tanh"

[loss]
name = "bce_with_logits"
[loss.params]

[optimizer]
name = "adamw"
[optimizer.params]
lr = 0.0001
weight_decay = 0.0

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]
# step_size = 10
# gamma = 0.5

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
verbose = 1
# run_dir = "outputs/runs/my_run"

[train]
epochs = 50
batch = 100
val_frac = 0.1
input_noise_training = 0.0
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 10
min_delta = 0.0
warmup = 5
restore_best = true

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]
# plugin-specific params

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "accuracy"

[[metrics]]
name = "f1"
[metrics.params]
average = "macro"
