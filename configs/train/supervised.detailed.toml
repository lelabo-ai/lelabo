config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "cifar10"
[dataset.params]
augment = false
# num_workers = 2
# pin_memory = true

[model]
name = "cnn"
[model.params]
channels = [64, 128, 256]
kernel_sizes = [3, 3, 3]
use_bn = true
pool_every = 1
activation = "relu"
output_activation = "identity"
head_mode = "gap"

[initializer]
name = "torch_default"
[initializer.params]
# seed = 2

[update_rule]
name = "bp"
[update_rule.params]

[loss]
name = "ce"
[loss.params]

[optimizer]
name = "sgd+momentum"
[optimizer.params]
lr = 0.05
weight_decay = 5e-4
momentum = 0.9

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]
# step_size = 10
# gamma = 0.5

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
display = "compact"
# run_dir = "outputs/runs/cifar10_bp"
# save_checkpoints = true

[train]
epochs = 20
batch = 128
val_frac = 0.1
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "val.acc"
mode = "auto"
patience = 8
min_delta = 0.0
warmup = 5
restore_best = true

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]
# plugin-specific params

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "acc"

[[metrics]]
name = "f1"
[metrics.params]
average = "macro"
