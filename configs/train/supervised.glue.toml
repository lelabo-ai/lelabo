config_version = "auto"
lelabo_version = "auto"
task = "supervised"

[dataset]
name = "glue"
[dataset.params]

[model]
name = "bert"
[model.params]

[initializer]
name = "torch_default"
[initializer.params]

[loss]
name = "ce"
[loss.params]

[update_rule]
name = "bp"
[update_rule.params]

[optimizer]
name = "adamw"
[optimizer.params]
lr = 2e-5
weight_decay = 0.01

[scheduler]
name = "none"
interval = "epoch"
monitor = "val.loss"
[scheduler.params]

[runtime]
device = "auto"
seed = 2
determinism = "relaxed"
display = "compact"

[train]
epochs = 3
batch = 16
val_frac = 0.1
input_noise_dataset = 0.0
noise_on_test = false

[[callbacks]]
name = "earlystopping"
enabled = true
[callbacks.params]
monitor = "train.loss"
mode = "auto"
patience = 2
min_delta = 0.0
warmup = 0
restore_best = true

[robustness]
mode = "none"
trials = 30
max_samples = 0
[robustness.params]

[hf]
glue_task = "sst2"
model = "bert-base-uncased"
trust_remote_code = false
max_length = 128

[[metrics]]
name = "acc"

[[metrics]]
name = "f1"
[metrics.params]
average = "macro"
