name: compare_all_mnist2
display_keys: [algo, lr, seed, layers, hidden,  optimizer]

base:
  dataset: mnist
  model: mlp
  epochs: 100
  batch: 128
  device: cuda
  robustness: none
  verbose: 0
  weight-decay: 1e-2
  optimizer: adamw

grid:
  algo: [kp]
  seed: [0]
  lr: [1e-3]
  hidden: [256, 2048]
  layers: [2, 8, 16]
